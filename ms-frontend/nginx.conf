server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    # En producción nginx hace el proxy que Vite hacía en dev.
    # La app React llama a /api/* → nginx reenvía al orchestrator.
    location /api/ {
        proxy_pass         http://ms-orchestrator:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 630s;
    }

    # Descarga de documentos PDC — fallback cuando S3 no está disponible.
    # El orchestrator devuelve download_url=/doc/{plan_id} y el navegador
    # resuelve la URL relativa aquí; nginx la reenvía al doc-processor interno.
    location /doc/ {
        proxy_pass         http://ms-doc-processor:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 30s;
    }

    # React Router: cualquier ruta que no sea un archivo estático
    # sirve index.html para que el router del cliente tome el control.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
